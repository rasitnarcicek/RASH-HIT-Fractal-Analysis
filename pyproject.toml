[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rash-hit-fractal-analysis"
version = "1.2.1"
description = "Pure NumPy supercover box-counting and fractal dimension (Db) analysis engine for SVG motifs, textile designs, and architectural patterns — zero Shapely/GEOS dependency."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    { name = "Mehmet Raşit Narçiçek" }
]
keywords = [
    "box-counting",
    "fractal-dimension",
    "fractal-analysis",
    "svg-analysis",
    "vector-geometry",
    "supercover",
    "geometric-contact",
    "computational-geometry",
    "motif-analysis",
    "textile-design",
    "pattern-analysis",
    "cultural-heritage",
    "architecture-morphology",
    "graphic-design",
    "fashion-design",
    "digital-humanities",
    "ornament-analysis"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "numpy>=1.24.0",
    "defusedxml>=0.7.1",
    "tinycss2>=1.2.0",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/rasitnarcicek/RASH-HIT-Fractal-Analysis"
Repository = "https://github.com/rasitnarcicek/RASH-HIT-Fractal-Analysis"
"Bug Tracker" = "https://github.com/rasitnarcicek/RASH-HIT-Fractal-Analysis/issues"
"Zenodo DOI" = "https://doi.org/10.5281/zenodo.21693694"

[project.scripts]
rash-hit-fractal = "run_analysis:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["backend"]
